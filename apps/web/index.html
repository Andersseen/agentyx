<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agentyx — Reusable environments for coding agents</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Agentyx is a provider-agnostic CLI that gives coding agents the same project-local development behavior across Codex, Claude Code, and Kimi Code."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        let stored;
        let prefersDark = false;

        try {
          stored = localStorage.getItem("agentyx-theme");
          prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // Ignore storage errors in private mode or SSR.
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
