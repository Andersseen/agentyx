version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Angular packages must share one version; a split bump breaks the production bundle.
      angular:
        patterns:
          - "@angular/*"
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    ignore:
      # changesets/action v2 requires @changesets/cli v3; we are on v2.
      - dependency-name: changesets/action
        update-types:
          - version-update:semver-major
