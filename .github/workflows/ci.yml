name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.mjs init --help
          node packages/cli/dist/index.mjs doctor --help
          node packages/cli/dist/index.mjs resolve angular
          node packages/cli/dist/index.mjs resolve angular --json

      - name: CLI project resolution
        run: node ../../packages/cli/dist/index.mjs resolve --json
        working-directory: examples/angular

      - name: Package smoke test
        run: pnpm smoke:pack

  # The check job runs the full gate and smoke:pack on Linux with Node 22 and 24. This job proves the
  # packed CLI installs, syncs, prunes and uninstalls on the other claimed platforms.
  platform-smoke:
    name: packaged smoke (${{ matrix.os }}, node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package smoke test
        run: pnpm smoke:pack
