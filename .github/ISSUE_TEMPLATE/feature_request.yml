name: Feature request
description: Suggest a capability for Agnox
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Agnox is early and deliberately narrow. Skills, MCP integration, provider adapters, project
        auto-detection, remote registries and plugins are already planned — please check
        [CONTRIBUTING.md](https://github.com/Andersseen/agnox/blob/main/CONTRIBUTING.md#scope) and
        existing issues before opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should Agnox do? Command output or configuration sketches help.
    validations:
      required: true

  - type: checkboxes
    id: provider-agnostic
    attributes:
      label: Provider agnostic
      description: |
        Agnox stacks describe development environments, never providers. Provider-specific behaviour
        belongs in adapters.
      options:
        - label: This proposal does not add provider-specific concepts to the stack model.
          required: true
