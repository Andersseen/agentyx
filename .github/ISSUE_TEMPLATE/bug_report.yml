name: Bug report
description: Something in Agentyx behaves incorrectly
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security issues — see
        [SECURITY.md](https://github.com/Andersseen/agentyx/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The command you ran and, if relevant, the `.agentyx.json` you used.
      render: shell
    validations:
      required: true

  - type: input
    id: agentyx-version
    attributes:
      label: Agentyx version
      placeholder: 0.0.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.20.1
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5
    validations:
      required: false
